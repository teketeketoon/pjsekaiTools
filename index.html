<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロセカ 支援先リスト</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f7f9;--surface:#fff;--text:#1d2a33;--sub:#6b7b86;--line:#dbe3e8;--accent:#1d2a33;
  --c-box:#1fb5a5;--c-mix:#f08a24;--c-sum:#8a6bd6;--c-wl:#e0568a;--c-etc:#7d8b95;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#151c21;--surface:#1f282e;--text:#e8eef2;--sub:#8fa0ab;--line:#33414a;--accent:#e8eef2;--c-box:#3fd0c0;--c-mix:#ffa04a;--c-sum:#a68cf0;--c-wl:#ff7aa8;--c-etc:#9fb2bd}
}
:root[data-theme="dark"]{--bg:#151c21;--surface:#1f282e;--text:#e8eef2;--sub:#8fa0ab;--line:#33414a;--accent:#e8eef2;--c-box:#3fd0c0;--c-mix:#ffa04a;--c-sum:#a68cf0;--c-wl:#ff7aa8;--c-etc:#9fb2bd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.35rem;margin:0 0 4px}
.lead{margin:0 0 16px;color:var(--sub);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.lbl{font-size:.78rem;color:var(--sub);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{--c:var(--sub);border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:700}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:1rem;margin-bottom:8px}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{width:100%;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;background:var(--accent);color:var(--bg);cursor:pointer}
.err{color:var(--c-wl);font-size:.82rem;margin:0 0 8px;min-height:0}
.card+.card{margin-top:14px}
#reached{margin-top:12px}
#reached:empty{margin:0}
.limgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.limrow{display:flex;align-items:center;gap:8px;font-size:.85rem}
.limrow span{flex:none;min-width:4.6em}
.limrow select{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:.95rem}
.hint{font-size:.75rem;color:var(--sub);margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:22px 0 10px;padding-bottom:4px}
.tab{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent);font-weight:700}
.tab b{margin-left:4px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 8px 10px 12px}
li .body{flex:1;min-width:0}
li .name{font-weight:700;display:block;min-width:0;overflow-wrap:anywhere}
.ttl{overflow-wrap:anywhere}
li .meta{font-size:.78rem;color:var(--sub);overflow-wrap:anywhere}
.cy{display:inline-block;margin-left:8px;font-size:.75rem;font-weight:700;color:var(--text);border:1.5px solid var(--c);border-radius:999px;padding:0 6px;vertical-align:1px}
.tag{color:var(--text);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 2px}
.meta .linkbox{display:inline-flex;margin-left:8px;vertical-align:middle;max-width:100%}
.meta>.open{margin-left:8px;vertical-align:middle}
.name .linkbox{display:inline-flex;margin-left:8px;vertical-align:middle;max-width:none}
.name>.open{margin-left:8px;vertical-align:middle}
.grp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:8px;vertical-align:middle;max-width:100%}
.grp .cy,.grp .linkbox{margin-left:0}
.grp .linkbox{flex-wrap:nowrap}
.name .cy,.name .linkbox,.name>.open{margin-left:0}
.name .cy{flex:none}
.name .linkbox{flex:0 1 auto;min-width:0;flex-wrap:nowrap;justify-content:flex-start}
.name .linkbox .open{flex:0 1 auto;min-width:0}
.name .linkbox .open:not(:first-child){min-width:2.8em}
.name .linkbox .open:first-child{flex:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.top .name{flex:1;min-width:0}
.linkbox{flex:none;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px;max-width:62%}
.linkbox .open{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.acct{font-size:.68rem;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open{flex:none;display:inline-block;text-decoration:none;color:var(--text);border:1.5px solid var(--c);border-radius:999px;padding:2px 7px;font-size:.72rem;font-weight:700;white-space:nowrap;line-height:1.5}
.open:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.del{border:0;background:transparent;color:var(--sub);font-size:1.3rem;width:32px;height:40px;border-radius:8px;cursor:pointer}
.del:hover{color:var(--c-wl)}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);width:calc(100% - 32px);max-width:528px;padding:14px 18px;border-radius:12px;font-size:.95rem;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:5}
.toast span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast.on{display:flex}
.toast button{flex:none;padding:6px 4px;background:transparent;border:0;color:inherit;text-decoration:underline;font:inherit;font-weight:700;cursor:pointer}
.name .linkbox{display:contents}
.name .cy,.name .open{margin-left:6px;vertical-align:middle;max-width:100%}
.name .linkbox .open:not(:first-child){min-width:0}
.name .linkbox{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:4px;margin-left:6px;vertical-align:middle;max-width:100%}
.name .linkbox .open{margin-left:0;flex:0 1 auto;min-width:0}
.name .linkbox .open:first-child{flex:none}
</style>
</head>
<body>
<main>
  <h1>プロセカ 支援先リスト</h1>
  <p class="lead">イベントの種類・ユニット・キャラクターを選んで追加します。</p>

  <section class="card" aria-label="支援先を追加">
    <p class="lbl">イベントの種類</p><div class="chips" id="cats"></div>
    <p class="lbl">ユニット</p><div class="chips" id="units"></div>
    <div id="charsWrap"><p class="lbl">キャラクター</p><div class="chips" id="chars"></div></div>
    <div id="cycleWrap"><p class="lbl">周期</p><div class="chips" id="cycle"></div></div>
    <div id="roundWrap"><p class="lbl">第何回ですか？</p><input type="text" id="round" placeholder="回数を入力（例: 12）（任意）" autocomplete="off"></div>
    <div id="puWrap"><p class="lbl">PUキャラ　複数選択できます</p><div id="pu"></div></div>
    <p class="lbl">鯖（サーバー）名</p>
    <input type="text" id="server" placeholder="サーバー名を入力（任意）" autocomplete="off">
    <p class="lbl">Twitterリンク</p>
    <input type="text" id="tw" placeholder="Twitterのリンクを貼り付け（任意）" autocomplete="off">
    <p class="lbl">メモ</p>
    <input type="text" id="memo" placeholder="メモ（任意）" autocomplete="off">
    <p class="err" id="err"></p>
    <button class="add" id="add">追加する</button>
  </section>
  <section class="card" aria-label="掛け持ち上限">
    <p class="lbl">掛け持ち上限（イベントの種類ごと）</p>
    <div class="limgrid" id="limits"></div>
    <p class="hint">「なし」は上限なしです。イベントの種類・ユニット・キャラクター・周期が同じ支援先を追加すると、カウントが1増えます。</p>
    <div id="reached"></div>
  </section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <ul id="list"></ul>
</main>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">元に戻す</button></div>

<script>
var CATS=[
  {id:'box',label:'箱イベ',c:'var(--c-box)'},
  {id:'mix',label:'混合イベ',c:'var(--c-mix)'},
  {id:'sum',label:'総集編',c:'var(--c-sum)'},
  {id:'wl',label:'WL・WC',c:'var(--c-wl)'},
  {id:'etc',label:'その他',c:'var(--c-etc)'}
];
var UNITS=[
  {n:'Leo/need',s:'Leo/need',c:'#4455dd',m:['星乃一歌','天馬咲希','望月穂波','日野森志歩']},
  {n:'MORE MORE JUMP!',s:'MORE MORE JUMP!',c:'#88dd44',m:['花里みのり','桐谷遥','桃井愛莉','日野森雫']},
  {n:'Vivid BAD SQUAD',s:'Vivid BAD SQUAD',c:'#ee1166',m:['小豆沢こはね','白石杏','東雲彰人','青柳冬弥']},
  {n:'ワンダーランズ×ショウタイム',s:'ワンダーランズ×ショウタイム',c:'#ff9900',m:['天馬司','鳳えむ','草薙寧々','神代類']},
  {n:'25時、ナイトコードで。',s:'25時、ナイトコードで。',c:'#884499',m:['宵崎奏','朝比奈まふゆ','東雲絵名','暁山瑞希']},
  {n:'VIRTUAL SINGER',s:'VIRTUAL SINGER',c:'#33ccbb',m:['初音ミク','鏡音リン','鏡音レン','巡音ルカ','MEIKO','KAITO']},
  {n:'フィナーレ',s:'フィナーレ',c:'var(--sub)',m:[],wl:true}
];
var ORDER=[5,0,1,2,3,4,6];
var KEY='sekai-support-list-v2',OLD='sekai-support-list-v1';
var items=[],selCat='box',selU=-1,selCh=-1,selCy=0,selPu=[],filter='all',lastDeleted=null,timer=null;
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function cat(id){return CATS.filter(function(c){return c.id===id})[0]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function load(){
  try{var v=localStorage.getItem(KEY);if(v){items=JSON.parse(v);return}}catch(e){}
  try{
    var o=JSON.parse(localStorage.getItem(OLD)||'[]');
    items=o.map(function(i){
      var n=i.name||'',u=-1,ch=-1;
      UNITS.forEach(function(x,ui){if(n===x.n)u=ui;x.m.forEach(function(m,ci){if(n===m){u=ui;ch=ci}})});
      return {id:i.id,cat:i.cat,u:u,ch:ch,memo:u<0?(n+(i.memo?' '+i.memo:'')):(i.memo||'')};
    });
    save();
  }catch(e){items=[]}
}
function findUrl(s){var m=(s||'').match(/https?:\/\/[^\s]+/);return m?m[0]:null}
function twUser(u){var m=u.match(/^https?:\/\/(?:www\.|mobile\.)?(?:twitter\.com|x\.com)\/([A-Za-z0-9_]{1,15})(?:[\/?#]|$)/i);if(!m)return null;return /^(i|home|intent|share|search|hashtag|explore|messages|notifications|settings)$/i.test(m[1])?null:m[1]}
function memoText(it){var u=findUrl(it.memo);return u?it.memo.replace(u,'').trim():(it.memo||'')}
function sortItems(arr){
  var ids=CATS.map(function(x){return x.id});
  return arr.map(function(it,i){return {it:it,i:i,c:ids.indexOf(it.cat),r:it.cat==='mix'?0:(it.u<0?9999:ORDER.indexOf(it.u)*100+it.ch+1)}})
    .sort(function(x,y){return x.c-y.c||x.r-y.r||x.i-y.i}).map(function(o){return o.it});
}
function chip(label,color,on,fn){
  var b=el('button','chip');b.style.setProperty('--c',color);b.setAttribute('aria-pressed',String(on));
  b.appendChild(el('i'));b.appendChild(document.createTextNode(label));b.onclick=fn;return b;
}
function renderPu(){
  var box=document.getElementById('pu');box.innerHTML='';
  if(selCat!=='mix')return;
  ORDER.forEach(function(ui){
    var u=UNITS[ui];
    if(!u.m.length)return;
    box.appendChild(el('p','lbl',u.n));
    var row=el('div','chips');
    u.m.forEach(function(m){
      row.appendChild(chip(m,u.c,selPu.indexOf(m)>=0,function(){var k=selPu.indexOf(m);if(k>=0)selPu.splice(k,1);else selPu.push(m);renderForm()}));
    });
    box.appendChild(row);
  });
}
function cycleOn(){return selCat!=='sum'&&selCat!=='mix'&&selCat!=='wl'&&selU>=0&&selU!==5&&selCh>=0}
function renderCycle(){
  var w=document.getElementById('cycleWrap'),c=document.getElementById('cycle');
  c.innerHTML='';
  if(!cycleOn()){selCy=0;w.style.display='none';return}
  w.style.display='';
  [[0,'指定なし'],[7,'7週'],[8,'8週']].forEach(function(p){c.appendChild(chip(p[1],UNITS[selU].c,selCy===p[0],function(){selCy=p[0];renderForm()}))});
}
function renderForm(){
  if(selU>=0&&UNITS[selU].wl&&selCat!=='wl'){selU=-1;selCh=-1}
  document.getElementById('puWrap').style.display=selCat==='mix'?'':'none';
  document.getElementById('roundWrap').style.display=selCat==='wl'?'':'none';
  renderPu();
  renderCycle();
  var a=document.getElementById('cats');a.innerHTML='';
  CATS.forEach(function(c){a.appendChild(chip(c.label,'var(--sub)',selCat===c.id,function(){selCat=c.id;renderForm()}))});
  var u=document.getElementById('units');u.innerHTML='';
  u.appendChild(chip('指定なし','var(--sub)',selU<0,function(){selU=-1;selCh=-1;renderForm()}));
  ORDER.forEach(function(i){var x=UNITS[i];if(x.wl&&selCat!=='wl')return;u.appendChild(chip(x.s,x.c,selU===i,function(){selU=i;selCh=-1;renderForm()}))});
  var w=document.getElementById('charsWrap'),c=document.getElementById('chars');
  c.innerHTML='';w.style.display=(selCat==='sum'||selU<0||!UNITS[selU].m.length)?'none':'';
  if(selU>=0&&selCat!=='sum'){
    var un=UNITS[selU];
    c.appendChild(chip('ユニット全体',un.c,selCh<0,function(){selCh=-1;renderForm()}));
    un.m.forEach(function(m,i){c.appendChild(chip(m,un.c,selCh===i,function(){selCh=i;renderForm()}))});
  }
}
var limits={box:0,mix:0,sum:0,wl:0,etc:0};
try{var lj=localStorage.getItem('sekai-limits-v3');if(lj){var lo=JSON.parse(lj);Object.keys(limits).forEach(function(k){limits[k]=Math.min(5,parseInt(lo[k],10)||0)})}}catch(e){}
function lim(c){return limits[c]||0}
function keyOf(it){return it.cat+'|'+it.u+'|'+it.ch+'|'+(it.cy||0)}
function counts(){var m={};items.forEach(function(it){if(it.u<0)return;var k=keyOf(it);(m[k]=m[k]||{n:0,it:it}).n++});return m}
function groupLabel(it){var un=UNITS[it.u],p=[cat(it.cat).label,un.n];if(it.ch>=0)p.push(un.m[it.ch]);if(it.cy)p.push(it.cy+'週');return p.join('　')}
function renderReached(){
  var box=document.getElementById('reached');box.innerHTML='';
  var m=counts(),reps=Object.keys(m).map(function(k){return m[k]}).filter(function(g){var l=lim(g.it.cat);return l>0&&g.n>=l}).map(function(g){return g.it});
  if(!Object.keys(limits).some(function(k){return limits[k]>0}))return;
  box.appendChild(el('p','lbl','上限に達したイベント（'+reps.length+'件）'));
  if(!reps.length){box.appendChild(el('div','empty','まだありません。'));return}
  var ul=el('ul');
  sortItems(reps).forEach(function(it){
    var li=el('li'),b=el('div','body');li.style.setProperty('--c',UNITS[it.u].c);
    b.appendChild(el('div','name',groupLabel(it)));
    b.appendChild(el('div','meta','掛け持ち '+m[keyOf(it)].n+'/'+lim(it.cat)));
    li.appendChild(b);ul.appendChild(li);
  });
  box.appendChild(ul);
}
function renderTabs(){
  renderReached();
  var box=document.getElementById('tabs');box.innerHTML='';
  [{id:'all',label:'すべて'}].concat(CATS).forEach(function(c){
    var n=c.id==='all'?items.length:items.filter(function(i){return i.cat===c.id}).length;
    var b=el('button','tab',c.label);b.setAttribute('role','tab');
    b.setAttribute('aria-selected',String(filter===c.id));b.appendChild(el('b',null,n));
    b.onclick=function(){filter=c.id;renderTabs();renderList()};box.appendChild(b);
  });
}
function renderList(){
  var ul=document.getElementById('list');ul.innerHTML='';
  var cm=counts();
  var shown=sortItems(items.filter(function(i){return filter==='all'||i.cat===filter}));
  if(!shown.length){ul.appendChild(el('div','empty',filter==='all'?'まだ支援先がありません。上のフォームから追加してください。':'この種別の支援先はまだありません。'));return}
  shown.forEach(function(it){
    var c=cat(it.cat),un=it.u>=0?UNITS[it.u]:null,txt=memoText(it);
    var mixNone=it.cat==='mix'&&!(un&&it.ch>=0);
    var title=mixNone?'指定なし':un?(it.ch>=0?un.m[it.ch]:un.n):(txt||[].concat(it.pu||[]).filter(Boolean).join('、')||'名称なし');
    var li=el('li');li.style.setProperty('--c',un?un.c:'var(--sub)');
    var body=el('div','body');var nm=el('div','name');nm.appendChild(el('span','ttl',title));var cyEl=null;if(it.cy){cyEl=el('span','cy',it.cy+'週');nm.appendChild(cyEl)}if(it.rd)nm.appendChild(el('span','cy','第'+it.rd+'回'));var top=el('div','top');top.appendChild(nm);body.appendChild(top);
    var meta=el('div','meta');meta.appendChild(el('span','tag',c.label));
    var g=un?cm[keyOf(it)]:null,L=lim(it.cat);
    if(g&&(L>0||g.n>=2))meta.appendChild(el('span',L>0&&g.n>=L?'tag':'','　掛け持ち '+g.n+(L>0?'/'+L:'')));
    var pus=[].concat(it.pu||[]).filter(Boolean),puNode=null;if(pus.length){puNode=document.createTextNode('　PU：'+pus.join('、'));meta.appendChild(puNode)}
    
    
    body.appendChild(meta);if(un&&(it.ch>=0||mixNone)){var ur=el('div','meta'),d1=el('span','dot');d1.style.background=un.c;ur.appendChild(d1);ur.appendChild(document.createTextNode(un.n));body.appendChild(ur)}if(it.sv)body.appendChild(el('div','meta','鯖：'+it.sv));if((un||mixNone)&&txt)body.appendChild(el('div','meta','メモ：'+txt));li.appendChild(body);
    var url=findUrl(it.tw||'')||findUrl(it.memo);var put=function(n){nm.appendChild(n)};
    if(url){
      var a=el('a','open',/^https?:\/\/(www\.|mobile\.)?(twitter\.com|x\.com)\//i.test(url)?'Twitter':'リンク');
      a.href=url;a.target='_blank';a.rel='noopener noreferrer';
      var user=twUser(url);
      if(user){var bx=el('div','linkbox');bx.appendChild(a);var p=el('a','open','@'+user);p.href='https://x.com/'+user;p.target='_blank';p.rel='noopener noreferrer';bx.appendChild(p);put(bx)}else put(a);
    }
    var delName=(mixNone&&pus.length)?'PU：'+pus.join('、'):title;
    var d=el('button','del','×');d.setAttribute('aria-label',delName+'を削除');d.onclick=function(){remove(it.id,delName)};
    li.appendChild(d);ul.appendChild(li);
  });
}
function add(){
  var m=document.getElementById('memo'),memo=m.value.trim(),err=document.getElementById('err');
  var pu=selCat==='mix'?selPu.slice():[];
  var rd=selCat==='wl'?document.getElementById('round').value.normalize('NFKC').replace(/\D/g,''):'';
  if(selU<0&&!memoText({memo:memo})&&!pu.length){err.textContent='ユニットを選ぶか、メモに名前を入力してください。';return}
  err.textContent='';
  items.unshift({id:Date.now()+''+Math.floor(Math.random()*1000),cat:selCat,u:selU,ch:selCat==='sum'?-1:selCh,cy:cycleOn()?selCy:0,rd:rd,pu:pu,sv:document.getElementById('server').value.trim(),tw:document.getElementById('tw').value.trim(),memo:memo});
  save();m.value='';document.getElementById('tw').value='';document.getElementById('server').value='';document.getElementById('round').value='';selPu=[];renderForm();renderTabs();renderList();
}
function remove(id,title){
  var idx=items.findIndex(function(i){return i.id===id});if(idx<0)return;
  lastDeleted={item:items[idx],idx:idx};items.splice(idx,1);save();renderTabs();renderList();
  document.getElementById('toastMsg').textContent='「'+title+'」を削除しました';
  var t=document.getElementById('toast');t.classList.add('on');
  clearTimeout(timer);timer=setTimeout(function(){t.classList.remove('on');lastDeleted=null},5000);
}
document.getElementById('undo').onclick=function(){
  if(!lastDeleted)return;
  items.splice(lastDeleted.idx,0,lastDeleted.item);lastDeleted=null;save();renderTabs();renderList();
  document.getElementById('toast').classList.remove('on');
};
document.getElementById('add').onclick=add;
var lbox=document.getElementById('limits');
CATS.forEach(function(c){
  var row=el('label','limrow');row.appendChild(el('span',null,c.label));
  var inp=el('select');[0,1,2,3,4,5].forEach(function(n){var o=el('option',null,n?String(n):'なし');o.value=String(n);inp.appendChild(o)});inp.value=String(limits[c.id]||0);
  inp.addEventListener('change',function(){
    limits[c.id]=parseInt(inp.value,10)||0;
    try{localStorage.setItem('sekai-limits-v3',JSON.stringify(limits))}catch(e){}
    renderReached();renderList();
  });
  row.appendChild(inp);lbox.appendChild(row);
});
document.getElementById('memo').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
load();items.forEach(function(i){if(i.cat==='sum')i.ch=-1});save();renderForm();renderTabs();renderList();
</script>
</body>
</html>
